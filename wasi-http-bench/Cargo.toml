[package]
name = "wasi-http-bench"
version = "0.1.0"
edition = "2024"

[lib]
# `cdylib` produces the wasm32 guest component; `rlib` lets the host benchmark
# and the `replay` binary link the `host` library module.
crate-type = ['cdylib', 'rlib']

# Guest (wasm32) component dependencies, selected by the `p2`/`p3` features.
# These drive the wasm32 `cdylib` build produced by the `justfile`.
[dependencies]
wasip3 = { version = "0.7.1", features = ["async-spawn"], optional = true }
wasip2 = { version = "1.0.0", optional = true }

[features]
p3 = ["dep:wasip3"]
p2 = ["dep:wasip2"]

# Host-side dependencies for the benchmark library (`src/host.rs`), the criterion
# harness, and the `replay` binary. They are restricted to non-wasm32 targets so
# the wasm32 guest `cdylib` build never pulls in wasmtime and friends.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { path = "../crates/wasmtime", features = ["component-model-async"] }
wasmtime-wasi = { path = "../crates/wasi" }
wasmtime-wasi-http = { path = "../crates/wasi-http", features = ["p3", "component-model-async"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# Criterion is only needed by the benchmark harness, never by the library or the
# `replay` binary.
[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "http_latency"
harness = false

# Standalone driver: set up + instantiate once, then execute many times on the
# same instance. Host-only (its body is `cfg`-gated off on wasm32).
[[bin]]
name = "replay"
bench = false

# Emit debug info in the benchmark binary so flamegraphs (xctrace/Instruments on
# macOS, perf on Linux) symbolicate to function + line rather than raw addresses.
# Only affects the host bench build; the wasm32 guest uses the `release` profile.
[profile.bench]
debug = true
